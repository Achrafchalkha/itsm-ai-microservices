# Application Configuration
spring.application.name=analytics-service
server.port=8086

# Database Configuration - using analytics_db database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:achrafmas03}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=analytics-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# JWT Configuration
jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.com.itsm.analytics=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.kafka=INFO

# External Services
user-service.url=${USER_SERVICE_URL:http://localhost:8082}
ticket-service.url=${TICKET_SERVICE_URL:http://localhost:8083}
assignment-service.url=${ASSIGNMENT_SERVICE_URL:http://localhost:8084}
notifications-service.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8085}

# Analytics Configuration
analytics.aggregation.enabled=true
analytics.aggregation.daily-job-cron=0 0 1 * * ?
analytics.aggregation.monthly-job-cron=0 0 2 1 * ?
analytics.sla.check-interval-minutes=15
analytics.satisfaction.enabled=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
