# Test configuration for Analytics Service

# Database configuration for tests (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Kafka for tests
spring.kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# JWT configuration for tests
jwt.secret=dGVzdC1zZWNyZXQtZm9yLWFuYWx5dGljcy1zZXJ2aWNlLXRlc3RzLW9ubHk=

# Service URLs for tests (mock services)
services.ticket-service.url=http://localhost:8082
services.user-service.url=http://localhost:8081
services.assignment-service.url=http://localhost:8084

# Disable scheduled jobs for tests
analytics.aggregation.enabled=false
analytics.sla.check-interval-minutes=999999

# Logging configuration for tests
logging.level.com.itsm.analytics=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Test-specific configurations
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true
