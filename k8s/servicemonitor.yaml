---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: itsm-microservices
  namespace: itsm
  labels:
    app: itsm-microservice
    release: prometheus
spec:
  selector:
    matchLabels:
      app: eureka-server
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
---
