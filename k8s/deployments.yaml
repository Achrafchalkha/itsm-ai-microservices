---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: itsm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: acritsmac742.azurecr.io/itsm-eureka-server:latest
        ports:
        - containerPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: itsm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: acritsmac742.azurecr.io/itsm-auth-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: itsm-config
              key: POSTGRES_HOST
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: itsm-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: itsm-secret
              key: POSTGRES_PASSWORD
        - name: EUREKA_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: itsm-config
              key: EUREKA_SERVER_URL
