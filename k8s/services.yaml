---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: itsm
  labels:
    app: eureka-server
spec:
  type: NodePort
  selector:
    app: eureka-server
  ports:
  - name: http
    port: 8761
    targetPort: 8761
    nodePort: 30761
    protocol: TCP
