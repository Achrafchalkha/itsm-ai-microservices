# Application Configuration
spring.application.name=ticket-service
server.port=8083

# Database Configuration - using ticket_db database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:achrafmas03}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=ticket-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# JWT Configuration - HS256 compatible secret (same as auth-service)
app.jwt.secret=${JWT_SECRET:bXlTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
app.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# File Storage Configuration
app.file-storage.base-path=uploads/tickets

# Gemini AI Configuration for NLP
app.nlp.enabled=true
app.nlp.gemini.api-key=${GEMINI_API_KEY:AIzaSyAgS3sVnW7vtJVHizPs26NA9Rp9HlkJgj8}
app.nlp.gemini.url=https://generativelanguage.googleapis.com/v1/models/gemini-1.5-pro:generateContent

# Logging Configuration
logging.level.com.itsm.ticket=DEBUG
logging.level.com.itsm.ticket.infrastructure.ai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# External Services
user-service.url=${USER_SERVICE_URL:http://localhost:8082}
assignment-service.url=${ASSIGNMENT_SERVICE_URL:http://localhost:8084}

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator Configuration for Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
